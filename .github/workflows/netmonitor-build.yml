name: NetMonitor APK 빌드

on:
  push:
    paths:
      - 'netmonitor/**'
      - '.github/workflows/netmonitor-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: netmonitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: debug APK 빌드
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: netmonitor-debug-apk
          path: netmonitor/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
